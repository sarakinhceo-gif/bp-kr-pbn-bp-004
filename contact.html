 /* CSS DNA: Street Brutalist Theme: Acid Yellow Font: System Mono / Impact */
 :root {
 --color-bg: #FAFAFA;
 --color-text: #000000;
 --color-accent: #DFFF00; /* Acid Yellow */
 --color-accent-hover: #CCEB00;
 --color-border: #000000;
 --font-display: 'Impact', 'Arial Black', sans-serif;
 --font-body: 'Courier New', Courier, monospace;
 --spacing-unit: 1rem;
 --border-width: 3px;
 }

 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 }

 html {
 font-size: 16px;
 scroll-behavior: smooth;
 }

 body {
 background-color: var(--color-bg);
 color: var(--color-text);
 font-family: var(--font-body);
 line-height: 1.6;
 overflow-x: hidden;
 border-left: var(--border-width) solid var(--color-border);
 border-right: var(--border-width) solid var(--color-border);
 max-width: 100vw;
 }

 a {
 color: inherit;
 text-decoration: none;
 font-weight: bold;
 }

 a:hover {
 background-color: var(--color-accent);
 text-decoration: line-through;
 }

 /* Typography */
 h1, h2, h3 {
 font-family: var(--font-display);
 text-transform: uppercase;
 letter-spacing: -1px;
 line-height: 1.1;
 margin-bottom: var(--spacing-unit);
 }

 h1 {
 font-size: clamp(2.5rem, 5vw, 5rem);
 border-bottom: var(--border-width) solid var(--color-border);
 padding: var(--spacing-unit) 0;
 }

 h2 {
 font-size: clamp(1.8rem, 3vw, 3rem);
 background-color: var(--color-text);
 color: var(--color-bg);
 padding: 0.5rem;
 display: inline-block;
 }

 h3 {
 font-size: 1.5rem;
 }

 p {
 margin-bottom: 1.5rem;
 font-size: 1.1rem;
 }

 /* Layout & Space */
 .container {
 max-width: 1200px;
 margin: 0 auto;
 padding: 0 var(--spacing-unit);
 }

 section {
 padding: 4rem 0;
 border-bottom: var(--border-width) solid var(--color-border);
 }

 /* Header & Nav */
 header {
 position: sticky;
 top: 0;
 background: var(--color-bg);
 z-index: 100;
 border-bottom: var(--border-width) solid var(--color-border);
 padding: 1rem 0;
 }

 .nav-wrapper {
 display: flex;
 justify-content: space-between;
 align-items: center;
 }

 .logo {
 font-family: var(--font-display);
 font-size: 1.5rem;
 background: var(--color-text);
 color: var(--color-accent);
 padding: 0.2rem 0.5rem;
 }

 .nav-menu {
 display: flex;
 gap: 2rem;
 list-style: none;
 }

 .nav-menu li a {
 font-size: 1.2rem;
 text-transform: uppercase;
 }

 .tel-link {
 background-color: var(--color-accent);
 padding: 0.5rem 1rem;
 border: 2px solid var(--color-border);
 font-weight: 900;
 }

 .tel-link:hover {
 background-color: var(--color-text);
 color: var(--color-accent);
 text-decoration: none;
 }

 /* Hamburger */
 .hamburger {
 display: none;
 font-size: 2rem;
 cursor: pointer;
 }

 /* Cards Grid */
 .grid-2 {
 display: grid;
 grid-template-columns: 1fr;
 gap: 2rem;
 }

 .card {
 border: var(--border-width) solid var(--color-border);
 padding: 2rem;
 background: #fff;
 box-shadow: 10px 10px 0px var(--color-text);
 transition: transform 0.2s;
 }

 .card:hover {
 transform: translate(-5px, -5px);
 box-shadow: 15px 15px 0px var(--color-accent);
 }

 .tag {
 display: inline-block;
 background: var(--color-text);
 color: var(--color-bg);
 padding: 0.2rem 0.5rem;
 font-size: 0.8rem;
 margin-bottom: 1rem;
 font-family: var(--font-display);
 }

 /* FAQ */
 .faq-item {
 border: 2px solid var(--color-border);
 margin-bottom: 1rem;
 padding: 1rem;
 }
 .faq-q {
 font-weight: bold;
 font-size: 1.2rem;
 margin-bottom: 0.5rem;
 display: flex;
 justify-content: space-between;
 }
 .faq-a {
 font-size: 0.95rem;
 }

 /* Responsive */
 @media (min-width: 768px) {
 .grid-2 {
 grid-template-columns: 1fr 1fr;
 }
 .hamburger {
 display: none;
 }
 }

 @media (max-width: 767px) {
 .nav-menu {
 display: none; /* Simplified for this snippet */
 }
 .hamburger {
 display: block;
 }
 h1 {
 font-size: 2.5rem;
 }
 .card {
 box-shadow: 5px 5px 0px var(--color-text);
 }
 }
